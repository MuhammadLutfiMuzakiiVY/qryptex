[workspace]
resolver = "2"
members = [
    "crates/qrypt-core",
    "crates/qrypt-kem",
    "crates/qrypt-signature",
    "crates/qrypt-combiner",
    "crates/qrypt-analysis",
    "crates/qrypt-benchmark",
    "crates/qrypt-cli",
    "crates/qrypt-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Muhammad Lutfi Muzaki"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/MuhammadLutfiMuzakiiVY/qryptex"
readme = "README.md"

[workspace.dependencies]
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "zeroize_derive"] }
sha3 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
rand_chacha = { version = "0.3", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

[workspace.lints.clippy]
needless_range_loop = "allow"
manual_div_ceil = "allow"
assign_op_pattern = "allow"
manual_range_contains = "allow"

